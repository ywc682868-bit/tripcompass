<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>奶油雜貨店 - 莫蘭迪質感管理後台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
        "firebase/database": "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js"
      }
    }
  </script>
</head>
<body class="bg-[#EFECE9] min-h-screen font-sans text-[#4A4543] antialiased pb-12">

  <!-- 登入遮罩 -->
  <div id="auth-overlay" class="fixed inset-0 bg-[#3E3A39]/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-[#F8F6F4] p-8 rounded-3xl shadow-xl max-w-sm w-full space-y-5 text-center border border-[#D5D0CC]">
      <div class="w-14 h-14 bg-[#B08889]/20 rounded-full flex items-center justify-center mx-auto text-[#B08889]">
        <i class="fa-solid fa-tree text-2xl"></i>
      </div>
      <div>
        <h2 class="text-xl font-bold text-[#4A4543]">管理員安全登入</h2>
        <p class="text-xs text-[#7A726E] mt-1">請輸入莫蘭迪聖誕後台管理帳號</p>
      </div>
      <form onsubmit="handleLogin(event)" class="space-y-3 text-left">
        <div>
          <label class="block text-xs font-semibold text-[#7A726E] mb-1">管理員 Email</label>
          <input type="email" id="admin-email" required placeholder="admin@butter.com" class="w-full p-2.5 bg-white border border-[#D5D0CC] rounded-xl text-sm focus:ring-2 focus:ring-[#B08889] focus:outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-[#7A726E] mb-1">密碼</label>
          <input type="password" id="admin-password" required placeholder="••••••••" class="w-full p-2.5 bg-white border border-[#D5D0CC] rounded-xl text-sm focus:ring-2 focus:ring-[#B08889] focus:outline-none">
        </div>
        <button type="submit" class="w-full py-3 bg-[#B08889] hover:bg-[#9E7778] text-white font-bold rounded-xl shadow-sm transition-all">登入後台</button>
      </form>
      <p id="login-error" class="text-xs text-rose-500 font-medium"></p>
    </div>
  </div>

  <!-- 後台主體內容 -->
  <div id="admin-content" class="hidden max-w-6xl mx-auto px-4 mt-6 space-y-6">
    <header class="bg-[#F8F6F4] p-5 rounded-2xl shadow-sm flex justify-between items-center border border-[#D5D0CC]">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-[#8F9E93]/20 rounded-xl flex items-center justify-center text-[#8F9E93]">
          <i class="fa-solid fa-cookie-bite text-lg"></i>
        </div>
        <h1 class="text-xl font-bold text-[#4A4543]">奶油雜貨店 · 莫蘭迪聖誕管理後台</h1>
      </div>
      <button onclick="handleLogout()" class="px-4 py-2 bg-[#E2DEDA] hover:bg-[#D5D0CC] text-[#4A4543] text-xs font-bold rounded-xl transition-all">安全登出</button>
    </header>

    <!-- 標籤導覽 -->
    <div class="flex border border-[#D5D0CC] bg-[#F8F6F4] rounded-2xl overflow-hidden shadow-sm p-1 gap-1">
      <button onclick="switchTab('procurement')" id="tab-btn-procurement" class="flex-1 py-2.5 font-bold text-sm bg-[#B08889] text-white rounded-xl transition-all">採購總統計表</button>
      <button onclick="switchTab('queue')" id="tab-btn-queue" class="flex-1 py-2.5 font-bold text-sm text-[#7A726E] hover:bg-[#EFECE9] rounded-xl transition-all">排隊出貨清單</button>
      <button onclick="switchTab('products')" id="tab-btn-products" class="flex-1 py-2.5 font-bold text-sm text-[#7A726E] hover:bg-[#EFECE9] rounded-xl transition-all">商品定價與縮圖管理</button>
    </div>

    <!-- 1. 採購總統計表 -->
    <div id="tab-procurement" class="bg-[#F8F6F4] rounded-2xl shadow-sm border border-[#D5D0CC] p-6 space-y-4">
      <h3 class="font-bold text-[#4A4543] text-base flex items-center gap-2"><i class="fa-solid fa-list-check text-[#B08889]"></i>自動加總採購清單</h3>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm">
          <thead>
            <tr class="bg-[#EFECE9] border-b border-[#D5D0CC] text-xs text-[#7A726E]">
              <th class="p-3 w-12 text-center rounded-l-xl">已購</th>
              <th class="p-3">商品名稱</th>
              <th class="p-3">規格</th>
              <th class="p-3 text-right">總數量</th>
              <th class="p-3 text-right">單價</th>
              <th class="p-3 text-right rounded-r-xl">小計</th>
            </tr>
          </thead>
          <tbody id="procurement-tbody" class="divide-y divide-[#EFECE9]"></tbody>
        </table>
      </div>
    </div>

    <!-- 2. 排隊出貨清單 -->
    <div id="tab-queue" class="hidden bg-[#F8F6F4] rounded-2xl shadow-sm border border-[#D5D0CC] p-6 space-y-4">
      <h3 class="font-bold text-[#4A4543] text-base flex items-center gap-2"><i class="fa-solid fa-clock-rotate-left text-[#8F9E93]"></i>依下單時間排序之客戶訂單</h3>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm">
          <thead>
            <tr class="bg-[#EFECE9] border-b border-[#D5D0CC] text-xs text-[#7A726E]">
              <th class="p-3 w-12 rounded-l-xl">序</th>
              <th class="p-3">時間</th>
              <th class="p-3">平台</th>
              <th class="p-3">買家</th>
              <th class="p-3">明細</th>
              <th class="p-3 text-right">金額</th>
              <th class="p-3 text-center rounded-r-xl">刪除</th>
            </tr>
          </thead>
          <tbody id="queue-tbody" class="divide-y divide-[#EFECE9]"></tbody>
        </table>
      </div>
    </div>

    <!-- 3. 商品定價與縮圖管理 -->
    <div id="tab-products" class="hidden bg-[#F8F6F4] rounded-2xl shadow-sm border border-[#D5D0CC] p-6 space-y-6">
      <div class="border border-[#D5D0CC] p-5 rounded-2xl bg-[#FAF9F7] space-y-4">
        <h3 id="form-title" class="font-bold text-[#4A4543] text-base flex items-center gap-2"><i class="fa-solid fa-gift text-[#B08889]"></i>新增上架商品（可上傳圖片看縮圖）</h3>
        <form onsubmit="saveProduct(event)" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3 items-center">
          <input type="hidden" id="edit-id">
          <input type="text" id="p-name" required placeholder="商品名稱" class="p-2.5 bg-white border border-[#D5D0CC] rounded-xl text-sm focus:ring-2 focus:ring-[#B08889] focus:outline-none">
          <input type="text" id="p-spec" placeholder="規格/顏色" class="p-2.5 bg-white border border-[#D5D0CC] rounded-xl text-sm focus:ring-2 focus:ring-[#B08889] focus:outline-none">
          <input type="number" id="p-price" required placeholder="單價 (NT$)" class="p-2.5 bg-white border border-[#D5D0CC] rounded-xl text-sm focus:ring-2 focus:ring-[#B08889] focus:outline-none">
          <div>
            <label class="block text-xs text-[#7A726E] mb-1">上傳圖片 (自動轉縮圖)</label>
            <input type="file" id="p-image-file" accept="image/*" class="text-xs w-full file:mr-2 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-[#8F9E93]/20 file:text-[#4A4543] hover:file:bg-[#8F9E93]/30">
          </div>
          <div class="flex gap-2">
            <button type="submit" id="submit-btn" class="flex-1 py-2.5 bg-[#8F9E93] hover:bg-[#7E8D82] text-white font-bold rounded-xl text-sm shadow-sm transition-all">確認上架</button>
            <button type="button" id="cancel-edit-btn" onclick="resetForm()" class="hidden px-3 py-2.5 bg-[#D5D0CC] hover:bg-[#C2BCB8] text-[#4A4543] font-bold rounded-xl text-sm">取消</button>
          </div>
        </form>
      </div>

      <!-- 商品卡片列表 -->
      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4" id="admin-product-grid"></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "firebase/app";
    import { getDatabase, ref, set, push, onValue, remove, update } from "firebase/database";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "firebase/auth";

    const firebaseConfig = {
      apiKey: "AIzaSyD25JH9MgZtpDbOgox8vp4_bS16-3Y_fnk",
      authDomain: "butter-grocery.firebaseapp.com",
      databaseURL: "https://butter-grocery-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "butter-grocery",
      storageBucket: "butter-grocery.firebasestorage.app",
      messagingSenderId: "498008003432",
      appId: "1:498008003432:web:4ecd08d11538d03f1b3cdd"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    let catalog = {}, orders = [], checkedStatus = {};

    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.getElementById("auth-overlay").classList.add("hidden");
        document.getElementById("admin-content").classList.remove("hidden");
        initListeners();
      } else {
        document.getElementById("auth-overlay").classList.remove("hidden");
        document.getElementById("admin-content").classList.add("hidden");
      }
    });

    window.handleLogin = function(e) {
      e.preventDefault();
      signInWithEmailAndPassword(auth, document.getElementById("admin-email").value, document.getElementById("admin-password").value)
        .catch(err => { document.getElementById("login-error").innerText = "登入失敗：" + err.message; });
    };

    window.handleLogout = () => signOut(auth);

    function initListeners() {
      onValue(ref(db, "catalog"), s => { catalog = s.val() || {}; renderAll(); });
      onValue(ref(db, "orders"), s => {
        const data = s.val() || {};
        orders = Object.keys(data).map(id => ({ id, ...data[id] }));
        orders.sort((a, b) => a.timestamp - b.timestamp);
        renderAll();
      });
      onValue(ref(db, "procurement_status"), s => { checkedStatus = s.val() || {}; renderProcurement(); });
    }

    window.switchTab = function(tab) {
      ['procurement', 'queue', 'products'].forEach(t => {
        document.getElementById(`tab-${t}`).classList.add('hidden');
        document.getElementById(`tab-btn-${t}`).className = "flex-1 py-2.5 font-bold text-sm text-[#7A726E] hover:bg-[#EFECE9] rounded-xl transition-all";
      });
      document.getElementById(`tab-${tab}`).classList.remove('hidden');
      document.getElementById(`tab-btn-${tab}`).className = "flex-1 py-2.5 font-bold text-sm bg-[#B08889] text-white rounded-xl shadow-sm transition-all";
    };

    function renderAll() {
      renderProcurement();
      renderQueue();
      renderProducts();
    }

    function renderProcurement() {
      const tbody = document.getElementById("procurement-tbody");
      if (!tbody) return;
      tbody.innerHTML = "";
      const map = {};
      orders.forEach(o => (o.items || []).forEach(i => {
        const key = `${i.name}_${i.spec || '預設'}`;
        if (!map[key]) map[key] = { ...i, totalQty: 0 };
        map[key].totalQty += i.qty;
      }));

      Object.keys(map).forEach(k => {
        const item = map[k], checked = checkedStatus[k] || false;
        tbody.innerHTML += `
          <tr class="${checked ? 'bg-[#8F9E93]/10 line-through text-[#A39E9A]' : 'hover:bg-[#FAF9F7]'} transition-colors">
            <td class="p-3 text-center"><input type="checkbox" ${checked ? 'checked' : ''} onchange="set(ref(db, 'procurement_status/${k}'), this.checked)" class="w-4 h-4 text-[#8F9E93] rounded border-[#D5D0CC] focus:ring-[#8F9E93]"></td>
            <td class="p-3 font-bold text-[#4A4543]">${item.name}</td>
            <td class="p-3 text-[#7A726E]">${item.spec || '-'}</td>
            <td class="p-3 text-right font-black text-[#B08889] text-base">${item.totalQty}</td>
            <td class="p-3 text-right text-[#7A726E]">NT$ ${item.price}</td>
            <td class="p-3 text-right font-bold text-[#4A4543]">NT$ ${item.price * item.totalQty}</td>
          </tr>`;
      });
    }

    function renderQueue() {
      const tbody = document.getElementById("queue-tbody");
      if (!tbody) return;
      tbody.innerHTML = "";
      orders.forEach((o, idx) => {
        const details = (o.items || []).map(i => `${i.name}(${i.spec || ''})x${i.qty}`).join(", ");
        tbody.innerHTML += `
          <tr class="hover:bg-[#FAF9F7] transition-colors">
            <td class="p-3 text-[#7A726E] font-medium">${idx + 1}</td>
            <td class="p-3 text-xs text-[#7A726E]">${o.createdAtStr}</td>
            <td class="p-3"><span class="bg-[#8F9E93]/20 text-[#4E5C53] px-2.5 py-1 rounded-lg text-xs font-semibold">${o.platform}</span></td>
            <td class="p-3 font-bold text-[#4A4543]">${o.customerName}</td>
            <td class="p-3 text-xs text-[#7A726E]">${details}</td>
            <td class="p-3 text-right font-bold text-[#B08889]">NT$ ${o.totalAmount}</td>
            <td class="p-3 text-center"><button onclick="remove(ref(db, 'orders/${o.id}'))" class="text-rose-400 hover:text-rose-600 transition-colors"><i class="fa-solid fa-trash"></i></button></td>
          </tr>`;
      });
    }

    function renderProducts() {
      const grid = document.getElementById("admin-product-grid");
      if (!grid) return;
      grid.innerHTML = "";
      Object.keys(catalog).forEach(id => {
        const item = catalog[id];
        grid.innerHTML += `
          <div class="border border-[#D5D0CC] rounded-2xl p-4 bg-white space-y-3 shadow-sm flex flex-col justify-between">
            <div>
              ${item.image ? `<img src="${item.image}" class="w-full h-36 object-cover rounded-xl mb-3 border border-[#EFECE9]" onerror="this.style.display='none'">` : '<div class="w-full h-36 bg-[#EFECE9] rounded-xl flex items-center justify-center text-xs text-[#A39E9A] mb-3"><i class="fa-regular fa-image mr-1"></i> 無圖片</div>'}
              <div class="font-bold text-sm text-[#4A4543]">${item.name} <span class="text-xs text-[#A39E9A]">(${item.spec || '無'})</span></div>
              <div class="text-[#B08889] font-semibold text-sm mt-1">NT$ ${item.price}</div>
            </div>
            <div class="flex gap-2 pt-2 border-t border-[#EFECE9]">
              <button onclick="editProduct('${id}')" class="flex-1 py-1.5 bg-[#EFECE9] hover:bg-[#D5D0CC] text-[#4A4543] text-xs font-bold rounded-xl transition-all">修改</button>
              <button onclick="remove(ref(db, 'catalog/${id}'))" class="flex-1 py-1.5 bg-rose-50 hover:bg-rose-100 text-rose-600 text-xs font-bold rounded-xl transition-all">刪除</button>
            </div>
          </div>`;
      });
    }

    window.saveProduct = function(e) {
      e.preventDefault();
      const editId = document.getElementById("edit-id").value;
      const name = document.getElementById("p-name").value.trim();
      const spec = document.getElementById("p-spec").value.trim();
      const price = Number(document.getElementById("p-price").value);
      const fileInput = document.getElementById("p-image-file");

      const saveData = (imageUrl) => {
        const payload = { name, spec, price };
        if (imageUrl !== undefined) payload.image = imageUrl;

        if (editId) {
          update(ref(db, `catalog/${editId}`), payload).then(() => resetForm());
        } else {
          payload.image = imageUrl || "";
          set(push(ref(db, "catalog")), payload).then(() => resetForm());
        }
      };

      if (fileInput.files && fileInput.files[0]) {
        const reader = new FileReader();
        reader.onload = function(event) {
          saveData(event.target.result);
        };
        reader.readAsDataURL(fileInput.files[0]);
      } else {
        saveData(editId ? undefined : "");
      }
    };

    window.editProduct = function(id) {
      const item = catalog[id];
      if (!item) return;
      document.getElementById("edit-id").value = id;
      document.getElementById("p-name").value = item.name;
      document.getElementById("p-spec").value = item.spec || "";
      document.getElementById("p-price").value = item.price;
      document.getElementById("form-title").innerHTML = `<i class="fa-solid fa-pen-to-square text-[#B08889]"></i> 修改商品資料`;
      document.getElementById("submit-btn").innerText = "確認修改";
      document.getElementById("cancel-edit-btn").classList.remove("hidden");
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.resetForm = function() {
      document.getElementById("edit-id").value = "";
      document.getElementById("p-name").value = "";
      document.getElementById("p-spec").value = "";
      document.getElementById("p-price").value = "";
      document.getElementById("p-image-file").value = "";
      document.getElementById("form-title").innerHTML = `<i class="fa-solid fa-gift text-[#B08889]"></i> 新增上架商品（可上傳圖片看縮圖）`;
      document.getElementById("submit-btn").innerText = "確認上架";
      document.getElementById("cancel-edit-btn").classList.add("hidden");
    };
  </script>
</body>
</html>
