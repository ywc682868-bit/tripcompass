<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>奶油雜貨店 - 線上選購系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
        "firebase/database": "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js"
      }
    }
  </script>
</head>
<body class="bg-amber-50 min-h-screen font-sans text-slate-800 antialiased pb-12">

  <header class="bg-amber-400 text-amber-950 shadow-md sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <i class="fa-solid font-bold text-2xl fa-cookie-bite"></i>
        <h1 class="text-2xl font-bold tracking-wide">奶油雜貨店 Butter Store</h1>
      </div>
      <!-- 隱蔽的管理登入入口：導向後台獨立頁面 -->
      <a href="admin.html" class="px-3 py-2 rounded-lg text-sm bg-amber-500/30 hover:bg-amber-500/50 text-amber-950 transition-all" title="商家後台登入">
        <i class="fa-solid fa-lock mr-1"></i> 管理登入
      </a>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 mt-6">
    <div id="connection-status" class="mb-6 p-3 rounded-lg text-sm bg-blue-50 text-blue-700 border border-blue-200">
      <i class="fa-solid fa-spinner fa-spin mr-2"></i> 連線資料庫中...
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <div class="lg:col-span-2 space-y-4">
        <h2 class="text-xl font-bold text-amber-900"><i class="fa-solid fa-boxes-packing mr-2"></i>商品目錄</h2>
        <div id="customer-product-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
      </div>

      <div class="lg:col-span-1">
        <div class="bg-white rounded-2xl shadow-sm border border-amber-200/80 p-5 sticky top-24 space-y-4">
          <h3 class="text-lg font-bold text-slate-800 border-b pb-2 flex justify-between items-center">
            <span><i class="fa-solid fa-cart-shopping text-amber-500 mr-2"></i>您的選購清單</span>
            <span id="cart-item-count" class="text-xs bg-amber-100 text-amber-800 px-2 py-0.5 rounded-full">0 件</span>
          </h3>
          <div id="cart-items-list" class="space-y-2 max-h-60 overflow-y-auto divide-y text-sm">
            <p class="text-slate-400 text-center py-6">尚未選擇商品</p>
          </div>
          <form onsubmit="submitCustomerOrder(event)" class="space-y-3 pt-3 border-t">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">購買平台</label>
              <select id="cust-platform" class="w-full text-sm p-2 rounded-lg border">
                <option value="LINE">LINE</option>
                <option value="Threads">Threads</option>
                <option value="IG">Instagram</option>
                <option value="FB">Facebook</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">買家暱稱 / ID <span class="text-red-500">*</span></label>
              <input type="text" id="cust-name" required placeholder="例如：Annn" class="w-full text-sm p-2 rounded-lg border">
            </div>
            <div class="bg-amber-50 p-3 rounded-lg flex justify-between items-center font-bold text-amber-900">
              <span>總金額：</span>
              <span id="cart-total-price" class="text-xl text-amber-600">NT$ 0</span>
            </div>
            <button type="submit" id="btn-submit-order" disabled class="w-full py-3 bg-amber-400 hover:bg-amber-500 disabled:opacity-50 text-amber-950 font-bold rounded-xl shadow">
              確認送出訂單
            </button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "firebase/app";
    import { getDatabase, ref, set, push, onValue } from "firebase/database";

    const firebaseConfig = {
      apiKey: "AIzaSyD25JH9MgZtpDbOgox8vp4_bS16-3Y_fnk",
      authDomain: "butter-grocery.firebaseapp.com",
      databaseURL: "https://butter-grocery-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "butter-grocery",
      storageBucket: "butter-grocery.firebasestorage.app",
      messagingSenderId: "498008003432",
      appId: "1:498008003432:web:4ecd08d11538d03f1b3cdd"
    };

    const db = getDatabase(initializeApp(firebaseConfig));
    let catalogProducts = {};
    let currentCart = {};

    onValue(ref(db, "catalog"), (snapshot) => {
      catalogProducts = snapshot.val() || {};
      renderCatalog();
      renderCart();
      document.getElementById("connection-status").className = "mb-6 p-3 rounded-lg text-sm bg-emerald-50 text-emerald-700 border border-emerald-200";
      document.getElementById("connection-status").innerHTML = `<i class="fa-solid fa-wifi mr-2"></i> 已連線至資料庫`;
    });

    function renderCatalog() {
      const grid = document.getElementById("customer-product-grid");
      grid.innerHTML = "";
      Object.keys(catalogProducts).forEach(id => {
        const item = catalogProducts[id];
        const qty = currentCart[id] || 0;
        const card = document.createElement("div");
        card.className = "bg-white p-4 rounded-xl border border-amber-100 shadow-sm flex flex-col justify-between";
        card.innerHTML = `
          <div>
            ${item.image ? `<img src="${item.image}" class="w-full h-36 object-cover rounded-lg mb-3" onerror="this.style.display='none'">` : ''}
            <div class="flex justify-between items-start gap-2">
              <h4 class="font-bold text-slate-800">${item.name}</h4>
              <span class="text-xs bg-amber-100 text-amber-800 px-2 py-0.5 rounded">${item.spec || '單一規格'}</span>
            </div>
            <p class="text-sm font-semibold text-amber-600 mt-1">NT$ ${item.price}</p>
          </div>
          <div class="flex items-center justify-between mt-4 pt-3 border-t">
            <span class="text-xs text-slate-400">數量</span>
            <div class="flex items-center gap-2">
              <button type="button" onclick="updateCart('${id}', -1)" class="w-8 h-8 rounded-lg border font-bold">-</button>
              <span class="w-6 text-center font-bold">${qty}</span>
              <button type="button" onclick="updateCart('${id}', 1)" class="w-8 h-8 rounded-lg bg-amber-400 font-bold">+</button>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    window.updateCart = function(id, change) {
      const next = (currentCart[id] || 0) + change;
      if (next <= 0) delete currentCart[id];
      else currentCart[id] = next;
      renderCatalog();
      renderCart();
    };

    function renderCart() {
      const cartList = document.getElementById("cart-items-list");
      const totalEl = document.getElementById("cart-total-price");
      const submitBtn = document.getElementById("btn-submit-order");
      cartList.innerHTML = "";
      let total = 0, count = 0;

      const keys = Object.keys(currentCart);
      if (keys.length === 0) {
        cartList.innerHTML = `<p class="text-slate-400 text-center py-6">尚未選擇商品</p>`;
        totalEl.innerText = "NT$ 0";
        submitBtn.disabled = true;
        return;
      }

      keys.forEach(id => {
        const item = catalogProducts[id];
        const qty = currentCart[id];
        total += item.price * qty;
        count += qty;
        cartList.innerHTML += `<div class="py-2 flex justify-between text-sm"><div><p class="font-medium">${item.name}</p><p class="text-xs text-slate-400">${item.spec || ''} x ${qty}</p></div><span class="font-bold">NT$ ${item.price * qty}</span></div>`;
      });

      totalEl.innerText = `NT$ ${total}`;
      document.getElementById("cart-item-count").innerText = `${count} 件`;
      submitBtn.disabled = false;
    }

    window.submitCustomerOrder = function(e) {
      e.preventDefault();
      const name = document.getElementById("cust-name").value.trim();
      if (!name) return alert("請填寫暱稱");

      const items = Object.keys(currentCart).map(id => ({
        name: catalogProducts[id].name,
        spec: catalogProducts[id].spec || "",
        price: catalogProducts[id].price,
        qty: currentCart[id]
      }));

      set(push(ref(db, "orders")), {
        platform: document.getElementById("cust-platform").value,
        customerName: name,
        items,
        totalAmount: items.reduce((sum, i) => sum + i.price * i.qty, 0),
        timestamp: Date.now(),
        createdAtStr: new Date().toLocaleString("zh-TW")
      }).then(() => {
        alert("訂單已送出！");
        currentCart = {};
        renderCatalog();
        renderCart();
      });
    };
  </script>
</body>
</html>
